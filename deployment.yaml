
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-book-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-book-store
  template:
    metadata:
      labels:
        app: online-book-store
    spec:
      containers:
        - name: online-book-store
          image: naveen24102006/online-book-store:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: online-book-store-service
spec:
  type: NodePort
  selector:
    app: online-book-store
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30010
